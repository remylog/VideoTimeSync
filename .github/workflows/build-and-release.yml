name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグがプッシュされた時に起動
  workflow_dispatch: # タグなしでもビルドだけ手動で確認できる

jobs:
  build-and-release:
    runs-on: macos-15 # Appleシリコン環境でビルド（XcodeGenが作るプロジェクト形式にはXcode 16以降が必要）
    permissions:
      contents: write # リリースを作成するために書き込み権限が必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch exiftool
        run: ./scripts/fetch-exiftool.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project VideoTimeSync.xcodeproj \
            -scheme VideoTimeSync \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            build

      - name: Compress app to ZIP
        run: |
          # macOSの実行権限を保持したままZIP化
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/VideoTimeSync.app VideoTimeSync-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoTimeSync-macOS
          path: VideoTimeSync-macOS.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoTimeSync-macOS.zip
          name: Release ${{ github.ref_name }}
          body: |
            VideoTimeSync の最新バージョンです。

            ### インストール方法
            1. `VideoTimeSync-macOS.zip` をダウンロードして解凍します。
            2. `VideoTimeSync.app` を「アプリケーション」フォルダに移動します。
            3. 初回起動時は右クリックから「開く」を選択してください。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
